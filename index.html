<script>/* ===== Bộ vẽ người (SVG) + chạy chuyển động lặp ===== */
var ORDER=['h','s','p','e','w','k','a','f','e2','w2','k2','a2','f2'];
var COL={skin:'#F0B98A',skinF:'#D9996A',top:'#F29A1F',topF:'#C97A10',sh:'#7A4A22',shF:'#5C3818',shoe:'#8E5BD0',shoeF:'#6C44A6',hair:'#5A3418',bar:'#9AA3B5',gr:'#D8C9AE'};

// Tạo tư thế: ô nào thiếu thì tay/chân xa lấy theo bên gần, lệch 6px
function P(o){
  var r={},i,k;
  for(i=0;i<ORDER.length;i++){k=ORDER[i];if(o[k])r[k]=o[k].slice();}
  var far={e2:'e',w2:'w',k2:'k',a2:'a',f2:'f'};
  for(k in far){if(!r[k]){var b=r[far[k]];r[k]=[b[0]-6,b[1]];}}
  return r;
}
function toVec(p){var v=[],i;for(i=0;i<ORDER.length;i++){v.push(p[ORDER[i]][0],p[ORDER[i]][1]);}return v;}
function toObj(v){var o={},i;for(i=0;i<ORDER.length;i++){o[ORDER[i]]=[v[i*2],v[i*2+1]];}return o;}
// Nâng cả người lên dy (số âm = lên), giữ nguyên các khớp trong keep
function lift(p,dy,keep){
  var r={},k;keep=keep||[];
  for(k in p){r[k]=[p[k][0],p[k][1]+(keep.indexOf(k)>=0?0:dy)];}
  return r;
}
function NS(tag,at,par){
  var e=document.createElementNS('http://www.w3.org/2000/svg',tag),k;
  for(k in at){e.setAttribute(k,at[k]);}
  if(par)par.appendChild(e);return e;
}
function seg(par,col,w){return NS('line',{stroke:col,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round'},par);}
function setSeg(el,a,b){el.setAttribute('x1',a[0]);el.setAttribute('y1',a[1]);el.setAttribute('x2',b[0]);el.setAttribute('y2',b[1]);}
function mid(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}

// Dựng hình người trong một thẻ <svg>; trả về hàm set(tư thế)
function createFigure(svg,ex){
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  svg.setAttribute('viewBox','0 6 240 168');
  var g=ex.ground||158,dir=ex.dir;
  NS('ellipse',{cx:120,cy:g+1,rx:104,ry:5,fill:COL.gr,opacity:.55},svg);
  if(ex.rig){
    var r=ex.rig;
    NS('line',{x1:r.x1,y1:r.y,x2:r.x1,y2:g,stroke:COL.bar,'stroke-width':5,'stroke-linecap':'round'},svg);
    NS('line',{x1:r.x2,y1:r.y,x2:r.x2,y2:g,stroke:COL.bar,'stroke-width':5,'stroke-linecap':'round'},svg);
    NS('line',{x1:r.x1-6,y1:r.y,x2:r.x2+6,y2:r.y,stroke:'#6F7A91','stroke-width':6,'stroke-linecap':'round'},svg);
  }
  // thứ tự vẽ: chân xa, tay xa, thân, chân gần, đầu, tay gần
  var fT=seg(svg,COL.shF,15),fS=seg(svg,COL.skinF,10),fShoe=seg(svg,COL.shoeF,8);
  var fA1=seg(svg,COL.skinF,8),fA2=seg(svg,COL.skinF,7),fHand=NS('circle',{r:4.5,fill:COL.skinF},svg);
  var tor=seg(svg,COL.top,24);
  var nShort=seg(svg,COL.sh,15);
  var nS=seg(svg,COL.skin,10),nShoe=seg(svg,COL.shoe,8);
  var neck=seg(svg,COL.skin,8);
  var head=NS('circle',{r:11,fill:COL.skin},svg);
  var hair=NS('path',{fill:COL.hair},svg);
  var eye1=NS('circle',{r:1.7,fill:'#2b2118'},svg),eye2=NS('circle',{r:1.7,fill:'#2b2118'},svg);
  var nA1=seg(svg,COL.skin,8),nA2=seg(svg,COL.skin,7),nHand=NS('circle',{r:4.5,fill:COL.skin},svg);
  return function(p){
    if(!p.h)p=toObj(p);
    // chân xa
    setSeg(fT,p.p,mid(p.p,p.k2,.9));
    setSeg(fS,p.k2,p.a2);setSeg(fShoe,p.a2,p.f2);
    setSeg(fA1,p.s,p.e2);setSeg(fA2,p.e2,p.w2);
    fHand.setAttribute('cx',p.w2[0]);fHand.setAttribute('cy',p.w2[1]);
    // thân
    setSeg(tor,p.p,p.s);
    // chân gần
    setSeg(nShort,p.p,mid(p.p,p.k,.9));
    setSeg(nS,p.k,p.a);setSeg(nShoe,p.a,p.f);
    // đầu
    setSeg(neck,p.s,p.h);
    head.setAttribute('cx',p.h[0]);head.setAttribute('cy',p.h[1]);
    var x=p.h[0],y=p.h[1],d;
    if(dir===0){d='M'+(x-11)+','+(y+1)+' A11 11 0 0 1 '+(x+11)+','+(y+1)+' Z';}
    else{d='M'+(x-dir*11)+','+(y+2)+' A11 11 0 0 '+(dir===1?1:0)+' '+(x+dir*3)+','+(y-10.6)+' L'+x+','+(y-1)+' Z';}
    hair.setAttribute('d',d);
    if(dir===0){
      eye1.setAttribute('cx',x-4);eye1.setAttribute('cy',y+3);eye2.setAttribute('cx',x+4);eye2.setAttribute('cy',y+3);
      eye2.style.display='';
    }else{
      eye1.setAttribute('cx',x+dir*5);eye1.setAttribute('cy',y+1);eye2.style.display='none';
    }
    // tay gần
    setSeg(nA1,p.s,p.e);setSeg(nA2,p.e,p.w);
    nHand.setAttribute('cx',p.w[0]);nHand.setAttribute('cy',p.w[1]);
  };
}

/* ===== Bộ chạy hoạt hình: nhiều hình cùng lúc, chỉ một vòng requestAnimationFrame ===== */
var PLAYERS=[],TICK=false;
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function createPlayer(svg,ex,onStep,speed){
  var set=createFigure(svg,ex);
  var fr=ex.frames.map(function(f){return {v:toVec(f.p),d:f.d,h:f.h||0};});
  var total=0,i;for(i=0;i<fr.length;i++)total+=fr[i].d+fr[i].h;
  var pl={svg:svg,t0:performance.now(),total:total,last:-1,speed:speed||1,
    draw:function(now){
      var t=((now-this.t0)*this.speed)%this.total,idx=0,n=fr.length,acc=0,from,to,u,v=[],j;
      for(idx=0;idx<n;idx++){
        var seglen=fr[idx].d+fr[idx].h;
        if(t<acc+seglen)break;acc+=seglen;
      }
      if(idx>=n)idx=n-1;
      var local=t-acc;
      from=fr[(idx+n-1)%n].v;to=fr[idx].v;
      u=fr[idx].d>0?Math.min(1,local/fr[idx].d):1;u=ease(u);
      for(j=0;j<to.length;j++)v.push(from[j]+(to[j]-from[j])*u);
      set(v);
      if(idx!==this.last){this.last=idx;if(onStep)onStep(idx);}
    }};
  PLAYERS.push(pl);pl.draw(pl.t0);startTick();
  return pl;
}
function startTick(){
  if(TICK)return;TICK=true;
  (function loop(now){
    var i,alive=[];
    for(i=0;i<PLAYERS.length;i++){
      if(PLAYERS[i].svg.isConnected){alive.push(PLAYERS[i]);if(!document.hidden)PLAYERS[i].draw(now);}
    }
    PLAYERS=alive;
    if(PLAYERS.length)requestAnimationFrame(loop);else TICK=false;
  })(performance.now());
}
// Hình tĩnh (dùng cho thẻ bước và ảnh nhỏ)
function drawStatic(svg,ex,frameIdx){
  var set=createFigure(svg,ex);set(ex.frames[frameIdx].p);
}

  });
  createPlayer($('hero'),ex,function(idx){
    var si=stepAt(ex,idx),j;

  },1);
  function upd(){LOC.cfg[ex.id]={sets:c.sets,n:c.n};saveLoc();$('sv').textContent=c.sets;$('nv').textContent=c.n;}

/* ===== Calis: chế độ tập, giáo án, lịch sử, cài đặt ===== */
var AC=null,WL=null,RUN=null;
function beep(f,d){
  if(!LOC.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';
    g.gain.value=.18;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d/1000);
  }catch(e){}
}
function startRun(items,title){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume();}catch(e){}
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){WL=l;}).catch(function(){});}catch(e){}
  RUN={items:items,title:title,qi:0,set:1,phase:'work',sub:'',done:[],t0:Date.now(),end:0,len:0,iv:null};
  beginWork();
}
function curItem(){var it=RUN.items[RUN.qi];return {it:it,ex:exById(it.ex)};}
function beginWork(){
  var c=curItem();RUN.phase='work';
  if(c.ex.mode==='time'){RUN.sub='ready';RUN.len=3000;RUN.end=Date.now()+3000;}
  else{RUN.sub='reps';RUN.end=0;}
  runUI();
}
function beginRest(sec){RUN.phase='rest';RUN.len=sec*1000;RUN.end=Date.now()+RUN.len;runUI();}
function completeSet(){
  var c=curItem(),d=null,i;
  for(i=0;i<RUN.done.length;i++)if(RUN.done[i].qi===RUN.qi)d=RUN.done[i];
  if(!d){d={qi:RUN.qi,ex:c.it.ex,sets:0,n:c.it.n};RUN.done.push(d);}
  d.sets++;beep(880,220);
  if(RUN.set<c.it.sets){RUN.set++;beginRest(c.ex.rest);}
  else if(RUN.qi<RUN.items.length-1){RUN.qi++;RUN.set=1;beginRest(c.ex.rest);}
  else finishRun();
}
function skipExercise(){
  if(RUN.qi<RUN.items.length-1){RUN.qi++;RUN.set=1;beginWork();}else finishRun();
}
function stopTimer(){if(RUN&&RUN.iv){clearInterval(RUN.iv);RUN.iv=null;}}
function closeRun(){
  stopTimer();var r=$('run');if(r)r.remove();
  try{if(WL){WL.release();WL=null;}}catch(e){}
  RUN=null;render();
}
function saveSession(){
  if(!RUN.done.length)return null;
  var s={id:uid(),date:ymd(new Date()),ts:Date.now(),title:RUN.title,mins:Math.max(1,Math.round((Date.now()-RUN.t0)/60000)),updated:Date.now(),
    items:RUN.done.map(function(d){return {ex:d.ex,sets:d.sets,n:d.n};})};
  DB.history.push(s);saveDB();return s;
}
function finishRun(){
  stopTimer();beep(660,150);setTimeout(function(){beep(990,300);},200);
  var s=saveSession(),r=$('run');
  var h='<div class="top"><span>Hoàn thành</span></div><div class="big" style="font-size:56px">🎉</div><div class="lab"><b>'+RUN.title+'</b></div>';
  if(s){
    var sets=0;s.items.forEach(function(i){sets+=i.sets;});
    h+='<div class="num"><div class="card"><b>'+s.mins+'</b>phút</div><div class="card"><b>'+sets+'</b>hiệp</div><div class="card"><b>'+s.items.length+'</b>bài</div></div><div style="margin-top:12px">';
    s.items.forEach(function(i){var e=exById(i.ex);h+='<div class="sub" style="padding:2px 2px">'+e.name+' · '+i.sets+' × '+i.n+' '+unit(e)+'</div>';});
    h+='</div>';
  }else h+='<div class="empty">Chưa hoàn thành hiệp nào nên không lưu vào lịch sử.</div>';
  h+='<div class="grid"><button class="btn or" id="fin">Xong</button></div>';
  r.innerHTML=h;$('fin').onclick=function(){closeRun();go('hist');};
}
function exitRun(){
  var msg=RUN.done.length?'Phần đã tập sẽ được lưu vào lịch sử.':'Chưa có hiệp nào hoàn thành nên sẽ không lưu.';
  ask('Thoát buổi tập?',msg,'Thoát',true,function(){saveSession();closeRun();});
}
function fmtT(ms){var s=Math.max(0,Math.ceil(ms/1000));return s;}
function runUI(){
  stopTimer();
  var r=$('run');if(!r){r=document.createElement('div');r.id='run';r.className='run';document.body.appendChild(r);}
  var c=curItem(),ex=c.ex,it=c.it,n=RUN.items.length,h='';
  h+='<div class="top"><span>Bài '+(RUN.qi+1)+'/'+n+' · Hiệp '+RUN.set+'/'+it.sets+'</span><span>'+RUN.title+'</span></div>';
  if(RUN.phase==='rest'){
    h+='<div class="lab rest" style="margin-top:14px"><b>NGHỈ</b></div><div class="big rest" id="big"></div><div class="bar"><i id="pb"></i></div>';
    h+='<div class="lab">Kế tiếp: <b>'+ex.name+'</b>, hiệp '+RUN.set+'</div><div class="hero"><svg id="rs"></svg></div>';
    h+='<div class="grid"><button class="btn or" id="skip">Bỏ qua nghỉ</button><button class="btn ghost" id="plus">+15 giây</button><button class="btn ghost" id="quit">Thoát</button></div>';
  }else{
    h+='<div class="name" style="text-align:center;margin-top:6px;font-size:22px">'+ex.name+'</div><div class="hero"><svg id="rs"></svg><div class="cap" id="rcap"></div></div>';
    if(ex.mode==='reps'){
      h+='<div class="big">'+it.n+'</div><div class="lab">lần · làm xong bấm “Xong hiệp”</div>';
      h+='<div class="grid"><button class="btn or" id="done">✓ Xong hiệp</button><button class="btn ghost" id="next">Bỏ qua bài này</button><button class="btn ghost" id="quit">Thoát</button></div>';
    }else{
      h+='<div class="big" id="big"></div><div class="bar"><i id="pb"></i></div><div class="lab" id="lb"></div>';
      h+='<div class="grid"><button class="btn or" id="done">✓ Xong sớm</button><button class="btn ghost" id="next">Bỏ qua bài này</button><button class="btn ghost" id="quit">Thoát</button></div>';
    }
  }
  r.innerHTML=h;
  createPlayer($('rs'),ex,function(idx){var cp=$('rcap');if(cp)cp.textContent='Bước '+(stepAt(ex,idx)+1)+': '+ex.steps[stepAt(ex,idx)].t;},1);
  $('quit').onclick=exitRun;
  if(RUN.phase==='rest'){
    $('skip').onclick=function(){beginWork();};
    $('plus').onclick=function(){RUN.end+=15000;RUN.len+=15000;};
  }else{
    $('done').onclick=function(){if(ex.mode==='time'&&RUN.sub==='ready')return;completeSet();};
    $('next').onclick=skipExercise;
  }
  if(RUN.end){
    var last=-1;
    RUN.iv=setInterval(function(){
      var left=RUN.end-Date.now(),s=fmtT(left),big=$('big');
      if(big){big.textContent=s;}
      var pb=$('pb');if(pb)pb.style.width=Math.max(0,Math.min(100,100*(1-left/RUN.len)))+'%';
      var lb=$('lb');if(lb)lb.textContent=RUN.sub==='ready'?'Chuẩn bị…':'giây còn lại · giữ đều nhịp thở';
      if(s!==last&&s<=3&&s>0)beep(660,120);
      last=s;
      if(left<=0){
        stopTimer();
        if(RUN.phase==='rest')beginWork();
        else if(RUN.sub==='ready'){beep(990,250);RUN.sub='go';RUN.len=it.n*1000;RUN.end=Date.now()+RUN.len;runUI();}
        else completeSet();
      }
    },200);
  }
}

/* ----- Giáo án ----- */
function renderPlans(m){
  var h='<div class="note" style="margin:0 2px 10px">Gợi ý tập 3 buổi mỗi tuần, cách nhau ít nhất 1 ngày nghỉ. Mỗi buổi gồm các bài bên dưới, bấm bắt đầu để app dẫn từng hiệp và đếm giờ nghỉ.</div>';
  m.innerHTML=h;
  PROGRAMS.forEach(function(p){
    var c=document.createElement('div');c.className='card';
    var list='';p.items.forEach(function(i){var e=exById(i.ex);list+='<div class="sub" style="padding:2px 0">• '+e.name+' · '+i.sets+' × '+i.n+' '+unit(e)+'</div>';});
    c.innerHTML='<span class="tag">'+p.day+'</span><div class="name" style="margin-top:4px">'+p.name+'</div><div class="sub" style="margin-bottom:6px">'+p.desc+'</div>'+list+'<div style="margin-top:10px"><button class="btn or" data-p="'+p.id+'">▶ Bắt đầu giáo án</button></div>';
    c.querySelector('button').onclick=function(){startRun(p.items.map(function(i){return {ex:i.ex,sets:i.sets,n:i.n};}),p.name);};
    m.appendChild(c);
  });
}

/* ----- Lịch sử ----- */
function liveHist(){return DB.history.filter(function(s){return !s.deleted;}).sort(function(a,b){return b.ts-a.ts;});}
function renderHist(m){
  var hs=liveHist(),days={},i;
  hs.forEach(function(s){days[s.date]=(days[s.date]||0)+1;});
  var now=new Date(),wk=0,start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));start.setHours(0,0,0,0);
  hs.forEach(function(s){if(s.ts>=start.getTime())wk++;});
  var d=new Date(now);if(!days[ymd(d)])d.setDate(d.getDate()-1);
  var streak=0;while(days[ymd(d)]){streak++;d.setDate(d.getDate()-1);}
  var h='<div class="num"><div class="card"><b>'+wk+'</b><span class="sub">buổi tuần này</span></div><div class="card"><b>'+streak+'</b><span class="sub">ngày liên tiếp</span></div><div class="card"><b>'+hs.length+'</b><span class="sub">tổng số buổi</span></div></div>';
  h+='<h2>14 ngày gần nhất</h2><div class="card"><div class="days">';
  var names=['CN','T2','T3','T4','T5','T6','T7'];
  for(i=13;i>=0;i--){var x=new Date(now);x.setDate(now.getDate()-i);h+='<div class="dot'+(days[ymd(x)]?' on':'')+'"><i></i>'+pad(x.getDate())+'/'+pad(x.getMonth()+1)+'</div>';}
  h+='</div></div><h2>Các buổi đã tập</h2>';
  m.innerHTML=h;
  if(!hs.length){var e=document.createElement('div');e.className='empty';e.textContent='Chưa có buổi nào. Hoàn thành một bài để bắt đầu ghi lịch sử.';m.appendChild(e);}
  hs.forEach(function(s){
    var c=document.createElement('div');c.className='card';
    var sets=0,list='';s.items.forEach(function(i){sets+=i.sets;var e=exById(i.ex);list+='<div class="sub">'+(e?e.name:i.ex)+' · '+i.sets+' × '+i.n+'</div>';});
    c.innerHTML='<div class="row"><div class="grow"><div class="name">'+s.title+'</div><div class="sub">'+vnDate(s.date)+' · '+s.mins+' phút · '+sets+' hiệp</div></div><button class="btn ghost sm" style="color:#c62828">Xóa</button></div><div style="margin-top:6px">'+list+'</div>';
    c.querySelector('button').onclick=function(){ask('Xóa buổi tập?',vnDate(s.date)+' · '+s.title,'Xóa',true,function(){s.deleted=true;s.updated=Date.now();saveDB();render();});};
    m.appendChild(c);
  });
}

/* ----- Cài đặt, sao lưu ----- */
function backupAge(){if(!LOC.backup)return null;return Math.floor((Date.now()-new Date(LOC.backup+'T00:00:00').getTime())/86400000);}
function renderSettings(m){
  var age=backupAge(),warn=(age===null||age>3);
  var h='<div class="card"><div class="inp"><span>Âm báo (hết giờ, nghỉ)</span><button class="btn ghost sm" id="snd">'+(LOC.sound?'Đang bật':'Đang tắt')+'</button></div><div class="note" style="margin:0">Nếu không nghe tiếng, kiểm tra công tắc im lặng bên hông iPhone.</div></div>';
  h+='<h2>Sao lưu lịch sử</h2><div class="card"><div class="sub" style="color:'+(warn?'#c62828':'#2e7d32')+'">'+(LOC.backup?'Sao lưu gần nhất: '+vnDate(LOC.backup)+(warn?' (đã quá 3 ngày)':''):'Chưa sao lưu lần nào')+'</div>';
  h+='<div style="display:grid;gap:8px;margin-top:10px"><button class="btn" id="exp">Xuất file sao lưu</button><button class="btn ghost" id="imp">Nhập file sao lưu</button></div><input type="file" id="fi" accept=".json,application/json" style="display:none">';
  h+='<div class="note">Dữ liệu chỉ nằm trong máy này. Xóa biểu tượng ngoài màn hình chính hoặc xóa dữ liệu Safari sẽ mất lịch sử, nên hãy sao lưu trước. Nhập file sẽ gộp thêm, không ghi đè.</div></div>';
  h+='<h2>Hướng dẫn sử dụng</h2><div class="card" style="font-size:14px"><b>Bài tập:</b> bấm một bài để xem hình chuyển động và các bước, chỉnh số hiệp, số lần rồi bấm Bắt đầu tập.<br><b>Giáo án:</b> chạy liền nhiều bài, tự đếm giờ nghỉ.<br><b>Lịch sử:</b> tự ghi lại khi bạn hoàn thành hiệp.<br><b>Cài ra màn hình chính:</b> mở bằng Safari, bấm nút Chia sẻ, chọn “Thêm vào Màn hình chính”.</div>';
  h+='<div class="note" style="text-align:center">Calis phiên bản '+APP_VER+'</div>';
  m.innerHTML=h;
  $('snd').onclick=function(){LOC.sound=!LOC.sound;saveLoc();render();if(LOC.sound)beep(660,120);};
  $('exp').onclick=exportData;
  $('imp').onclick=function(){$('fi').click();};
  $('fi').onchange=function(ev){
    var f=ev.target.files[0];if(!f)return;
    var rd=new FileReader();rd.onload=function(){
      try{
        var d=JSON.parse(rd.result);if(!d||!d.history)throw 0;
        var map={},add=0;DB.history.forEach(function(s){map[s.id]=s;});
        d.history.forEach(function(s){
          var o=map[s.id];
          if(!o){DB.history.push(s);add++;}
          else if((s.updated||0)>(o.updated||0)){for(var k in s)o[k]=s[k];}
        });
        saveDB();render();toast('Đã nhập, thêm '+add+' buổi mới');
      }catch(e){toast('File không đúng định dạng');}
    };rd.readAsText(f);
  };
}
function exportData(){
  var name='calis_'+ymd(new Date())+'.json';
  var blob=new Blob([JSON.stringify({app:'calis',version:APP_VER,exported:new Date().toISOString(),history:DB.history})],{type:'application/json'});
  var file;try{file=new File([blob],name,{type:'application/json'});}catch(e){file=null;}
  function mark(){LOC.backup=ymd(new Date());saveLoc();render();}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).then(mark).catch(function(){});
  }else{
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();mark();
  }
}

/* ----- Khởi động ----- */
document.addEventListener('DOMContentLoaded',function(){
  var bs=document.querySelectorAll('.tabs button'),i;
  for(i=0;i<bs.length;i++)bs[i].onclick=function(){go(this.dataset.t);};
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js');}catch(e){}
  render();
});

</script>
