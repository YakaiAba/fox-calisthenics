<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fox-calisthenics"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png">
<title>Fox-calisthenics</title>
<style>:root{--navy:#12306B;--bg:#f4f4f6;--line:#e3e5ea;--mut:#6b7280;--tint:#eef2fb;--ok:#2e7d32;--bad:#c62828;--rest:#7B5BD6;--ac:#12306B;--acl:#eef2fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#111;font:16px/1.35 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:disabled{opacity:.3;cursor:default}
input,select,textarea{font:inherit;font-size:16px}
#app{display:flex;flex-direction:column;height:100dvh}
header{background:#fff;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;border-bottom:1px solid var(--line)}
#ttl{font-weight:700;font-size:18px;color:var(--navy);line-height:1.2}
main{flex:1;overflow-y:auto;padding:12px 14px 24px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:4px 4px calc(env(safe-area-inset-bottom) + 4px);z-index:6}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:12px;font-size:12px;color:#444}
nav button i{font-style:normal;font-size:20px;line-height:1.1;height:26px;display:flex;align-items:center;justify-content:center}
nav button.on{background:var(--tint);color:var(--navy);font-weight:700}
.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.tap{cursor:pointer}
.sec{font-size:16px;font-weight:700;color:#111;margin:18px 2px 8px}
.sec.tg{display:flex;align-items:center;gap:8px;text-align:left;padding:0 2px;margin:0}
.sec.tg i{font-style:normal;font-size:12px;color:var(--mut)}
.sech{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 2px 8px}
.sech .sec{margin:0}
.lk{color:var(--navy);font-weight:700;font-size:15px;padding:6px 12px;border-radius:999px;background:var(--tint)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hrow.sm{margin-top:8px;font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.kick{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--mut)}
.name{font-weight:700;font-size:16px}
.sub{color:var(--mut);font-size:13px}
.amt{font-size:13px;font-weight:700;color:var(--navy);margin-top:2px}.amt.ok{color:var(--ok)}
.chev{color:#999;font-size:22px}
.grow{flex:1;min-width:0}
.xr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.xr:last-child{border-bottom:0}
.thumb{width:84px;height:58px;border-radius:10px;background:var(--tint);flex:none;object-fit:contain}
img.thumb{background:#fff;border:1px solid var(--line)}
.noimg{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:22px;background:var(--tint)}
.mrow{display:flex;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}.mrow:last-child{border-bottom:0}
.prow{padding:10px 0;border-bottom:1px solid var(--line)}.prow:last-child{border-bottom:0}
.mv{width:34px;height:32px;border-radius:8px;background:#e9ebf0;font-size:15px;margin-left:4px}
.mv.x{color:var(--bad)}
.ctl{display:flex;flex:none}
.st{display:flex;align-items:center;gap:8px}
.st button{width:34px;height:34px;border-radius:50%;border:1.5px solid #cfd3da;background:#fff;font-size:19px;color:#111}
.st b{min-width:30px;text-align:center;font-size:17px}
.inp{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0}
.inp input[type=time]{padding:6px 8px;border:1px solid #cfd3da;border-radius:10px;background:#fff}
.lb{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.nt{border:0;background:var(--tint);border-radius:10px;padding:10px;font-size:16px;font-family:inherit;color:#111}
.nt.big{flex:1;min-width:0;font-size:22px}
textarea.nt{resize:vertical;line-height:1.4}
.seg{display:flex;background:#e9ebf0;border-radius:12px;padding:3px;margin:2px 0 6px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-weight:600;color:#555}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 12px;border-radius:999px;border:1.5px solid #cfd3da;background:#fff;font-size:14px}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.icg{display:flex;flex-wrap:wrap;gap:6px}
.icg button{width:40px;height:40px;border-radius:10px;background:#e9ebf0;font-size:20px}
.icg button.on{background:var(--navy)}
.imgbox{background:var(--tint);border-radius:12px;height:180px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px}
.imgbox img{max-width:100%;max-height:100%}
.imgbox svg{width:100%;height:100%}
.imgbox .noimg{background:none;font-size:14px}
.two2{display:flex;gap:8px;flex-wrap:wrap}
.two2 .primary{flex:1;margin:0}
.primary{display:block;width:100%;background:var(--navy);color:#fff;font-weight:700;border-radius:999px;padding:13px;margin-top:12px;font-size:16px;text-align:center}
.primary.sm{padding:9px 14px;font-size:15px}
.primary.ghost{background:#e9ebf0;color:var(--navy)}
.primary.chi{background:var(--bad);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;background:var(--navy);color:#fff}
.btn.ghost{background:#e9ebf0;color:var(--navy)}
.btn.sm{font-size:14px}
.or{background:var(--navy)}
.stats{display:flex;gap:8px;margin-top:10px}
.stats div{flex:1;background:var(--tint);border-radius:10px;padding:8px;text-align:center;font-size:13px;color:var(--mut)}
.stats b{display:block;font-size:20px;color:var(--navy)}
.warn{background:#fdecea;color:var(--bad);border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
.ok{background:#e8f5e9;color:var(--ok);border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
.note2{background:#fff6e0;border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
.tipbox{background:#fff;border-left:4px solid var(--navy);border-radius:10px;padding:10px 12px;font-size:13.5px;color:#333;margin:14px 0;line-height:1.5}
.empty{text-align:center;color:var(--mut);padding:8px 0;font-size:13px}
.note{font-size:12.5px;color:var(--mut);margin:8px 2px}
.li{display:flex;align-items:center;gap:10px;width:100%;padding:13px 4px;border-bottom:1px solid var(--line);text-align:left}
.li:last-child{border-bottom:0}
.li i{font-style:normal;width:26px;text-align:center;font-size:20px}
.li span{flex:1}.li em{font-style:normal;color:var(--mut);font-size:13px}
.li:after{content:"›";color:#999;font-size:20px}
.sw{position:relative;display:inline-block;width:50px;height:30px;flex:none;margin-left:6px}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:#d5d8de;border-radius:15px;transition:.2s}
.sw span:before{content:"";position:absolute;width:26px;height:26px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span:before{transform:translateX(20px)}
.pk{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}.pk:last-child{border-bottom:0}
.pk input{width:22px;height:22px;accent-color:var(--navy)}
.week{display:flex;justify-content:space-between;margin-top:10px}
.wd{text-align:center;font-size:12px;color:var(--mut);width:13%}
.wd i{display:flex;align-items:center;justify-content:center;width:34px;height:34px;margin:3px auto 0;border-radius:50%;background:var(--bg);font-style:normal;font-weight:700;color:#111;font-size:14px}
.wd.on i{background:var(--navy);color:#fff}
.wd.td i{box-shadow:0 0 0 2px var(--navy)}
.bar{height:6px;background:#e3e5ea;border-radius:3px;margin:10px 0 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy)}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.cd{border-radius:12px;background:var(--bg);padding:8px 0 6px;font-size:18px;font-weight:800;display:flex;flex-direction:column;align-items:center}
.cd small{font-size:10.5px;font-weight:600;color:var(--mut)}
.cd.done{background:var(--navy);color:#fff}.cd.done small{color:#cfd8ef}
.cd.cur{box-shadow:inset 0 0 0 2px var(--navy)}
.cd.sel{outline:3px solid #ef8a17;outline-offset:1px}
.cd.lock{opacity:.45}
.hero{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.hero svg,.hero img,.hero .noimg{width:100%;display:block;background:var(--tint)}
.hero img{max-height:320px;object-fit:contain;background:#fff}
.hero .noimg{height:180px}
.hero .cap{background:var(--navy);color:#fff;padding:8px 12px;font-weight:600;min-height:42px;font-size:14.5px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{background:#fff;border-radius:12px;padding:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.step.on{outline:2.5px solid var(--navy)}
.step svg,.step img{width:100%;background:var(--tint);border-radius:8px}
.step b{display:block;color:var(--navy);font-size:13px;margin:4px 0 2px}
.step span{font-size:13.5px}
.days2{display:flex;gap:6px;justify-content:space-between}
.dd{flex:1;border:1.5px solid #cfd3da;background:#fff;border-radius:10px;padding:8px 0;font-size:13px;font-weight:700;color:var(--mut)}
.dd.on{background:var(--navy);border-color:var(--navy);color:#fff}
#page{position:fixed;inset:0;background:var(--bg);z-index:15;display:none;flex-direction:column}
#page.show{display:flex}
.ph{background:#fff;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.ph button{font-size:28px;width:40px;height:36px;color:var(--navy)}
#ptt{font-weight:700;font-size:17px;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{flex:1;overflow-y:auto;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
.pf{background:#fff;border-top:1px solid var(--line);padding:8px 14px calc(env(safe-area-inset-bottom) + 8px)}
.pf button{display:block;width:100%;padding:12px;border-radius:999px;background:var(--navy);color:#fff;font-weight:700}
.run{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
.run .top{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.run .big{font-size:76px;font-weight:800;text-align:center;line-height:1;margin:6px 0;color:var(--navy)}
.run .lab{text-align:center;color:var(--mut);margin-bottom:8px}
.run .hero{margin:6px 0}
.run .grid{margin-top:auto;display:grid;gap:8px}
.run .btn{display:flex;width:100%;padding:13px;font-size:17px}
.rest{color:var(--rest)}
.num{display:flex;gap:10px}
.num .card{flex:1;text-align:center;margin:0}
.num b{display:block;font-size:24px;color:var(--navy)}
.big2{font-size:28px;font-weight:800}.big2 small{font-size:15px;color:var(--mut);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center;font-size:14px}
.cal .ch{font-size:11px;color:var(--mut)}
.cday{border-radius:50%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.cday.on{background:var(--navy);color:#fff;font-weight:700}
.cday.td{box-shadow:inset 0 0 0 2px var(--navy)}
.chart{width:100%;margin-top:10px}
.chart .ct{font-size:13px;font-weight:700;fill:#111}
.chart .ax{font-size:11px;fill:var(--mut)}
.chart .gl{stroke:#e3e5ea}
.chart .ln{fill:none;stroke:var(--navy);stroke-width:2.5;stroke-linejoin:round}
.chart .dt{fill:#fff;stroke:var(--navy);stroke-width:2}
.bmi{position:relative;height:10px;border-radius:5px;margin:14px 0 4px;background:linear-gradient(90deg,#2F7BEA 0%,#2F7BEA 14%,#2e7d32 14%,#2e7d32 40%,#E8A020 40%,#E8A020 60%,#c62828 60%)}
.bmi i{position:absolute;top:-5px;width:4px;height:20px;margin-left:-2px;background:#111;border-radius:2px}
.bmil{position:relative;height:14px;font-size:11px;color:var(--mut)}
.bmil span{position:absolute;transform:translateX(-50%)}
.bmil span:nth-child(1){left:0;transform:none}.bmil span:nth-child(2){left:14%}.bmil span:nth-child(3){left:40%}.bmil span:nth-child(4){left:60%}.bmil span:nth-child(5){right:0;transform:none}
.guide{font-size:14px;line-height:1.55}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:50;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:360px;max-height:88dvh;overflow-y:auto}
.dlg h2{margin:0 0 8px;font-size:18px;color:var(--navy)}
.dlg .bt{display:flex;gap:10px;margin-top:14px}
.dlg .bt button{flex:1;padding:11px;border-radius:12px;background:#e9ebf0;font-weight:700}
.dlg .bt button.pr{background:var(--navy);color:#fff}.dlg .bt button.dg{background:var(--bad);color:#fff}
@media (max-width:359px){.thumb{width:70px;height:50px}.name{font-size:15px}.mv{width:30px}}
.editing .thumb{width:54px;height:40px}.editing .name{font-size:15px}
</style></head>
<body>
<div id="app">
<header><div id="ttl">Fox-calisthenics</div></header>
<main id="main"></main>
<nav>
<button data-t="home"><i>🏋️</i>Huấn luyện</button>
<button data-t="lib"><i>📋</i>Bài tập</button>
<button data-t="rep"><i>📊</i>Báo cáo</button>
<button data-t="set"><i>⋯</i>Cài đặt</button>
</nav>
</div>
<div id="page"><div class="ph"><button id="pback" aria-label="Quay lại">‹</button><div id="ptt"></div></div><div class="pb" id="pbody"></div><div class="pf"><button id="pexit">Thoát</button></div></div>
<script>/* ===== Bộ vẽ người (SVG) + chạy chuyển động lặp ===== */
var ORDER=['h','s','p','e','w','k','a','f','e2','w2','k2','a2','f2'];
var COL={skin:'#F0B98A',skinF:'#D9996A',top:'#2F7BEA',topF:'#1F5FC0',sh:'#2B3550',shF:'#1C2438',shoe:'#F2994A',shoeF:'#D17A2E',hair:'#4A2E18',bar:'#9AA3B5',gr:'#D6DEEC',box:'#C9D3E6',boxE:'#9AA8C2'};

// Tạo tư thế: ô nào thiếu thì tay/chân xa lấy theo bên gần, lệch 6px
function P(o){
  var r={},i,k;
  for(i=0;i<ORDER.length;i++){k=ORDER[i];if(o[k])r[k]=o[k].slice();}
  var far={e2:'e',w2:'w',k2:'k',a2:'a',f2:'f'};
  for(k in far){if(!r[k]){var b=r[far[k]];r[k]=[b[0]-6,b[1]];}}
  return r;
}
function toVec(p){var v=[],i;for(i=0;i<ORDER.length;i++){v.push(p[ORDER[i]][0],p[ORDER[i]][1]);}return v;}
function toObj(v){var o={},i;for(i=0;i<ORDER.length;i++){o[ORDER[i]]=[v[i*2],v[i*2+1]];}return o;}
// Nâng cả người lên dy (số âm = lên), giữ nguyên các khớp trong keep
function lift(p,dy,keep){
  var r={},k;keep=keep||[];
  for(k in p){r[k]=[p[k][0],p[k][1]+(keep.indexOf(k)>=0?0:dy)];}
  return r;
}
function NS(tag,at,par){
  var e=document.createElementNS('http://www.w3.org/2000/svg',tag),k;
  for(k in at){e.setAttribute(k,at[k]);}
  if(par)par.appendChild(e);return e;
}
function seg(par,col,w){return NS('line',{stroke:col,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round'},par);}
function setSeg(el,a,b){el.setAttribute('x1',a[0]);el.setAttribute('y1',a[1]);el.setAttribute('x2',b[0]);el.setAttribute('y2',b[1]);}
function mid(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}

// Dựng hình người trong một thẻ <svg>; trả về hàm set(tư thế)
function createFigure(svg,ex){
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  svg.setAttribute('viewBox','0 6 240 168');
  var g=ex.ground||158,dir=ex.dir;
  NS('ellipse',{cx:120,cy:g+1,rx:104,ry:5,fill:COL.gr,opacity:.55},svg);
  if(ex.box){var bx=ex.box;NS('rect',{x:bx.x,y:bx.y,width:bx.w,height:g-bx.y,rx:3,fill:COL.box,stroke:COL.boxE,'stroke-width':2},svg);}
  if(ex.wall){NS('rect',{x:ex.wall-10,y:10,width:10,height:g-10,fill:COL.box,stroke:COL.boxE,'stroke-width':2},svg);}
  if(ex.rig){
    var r=ex.rig;
    NS('line',{x1:r.x1,y1:r.y,x2:r.x1,y2:g,stroke:COL.bar,'stroke-width':5,'stroke-linecap':'round'},svg);
    NS('line',{x1:r.x2,y1:r.y,x2:r.x2,y2:g,stroke:COL.bar,'stroke-width':5,'stroke-linecap':'round'},svg);
    NS('line',{x1:r.x1-6,y1:r.y,x2:r.x2+6,y2:r.y,stroke:'#6F7A91','stroke-width':6,'stroke-linecap':'round'},svg);
  }
  // thứ tự vẽ: chân xa, tay xa, thân, chân gần, đầu, tay gần
  var fT=seg(svg,COL.shF,15),fS=seg(svg,COL.skinF,10),fShoe=seg(svg,COL.shoeF,8);
  var fA1=seg(svg,COL.skinF,8),fA2=seg(svg,COL.skinF,7),fHand=NS('circle',{r:4.5,fill:COL.skinF},svg);
  var tor=seg(svg,COL.top,24);
  var nShort=seg(svg,COL.sh,15);
  var nS=seg(svg,COL.skin,10),nShoe=seg(svg,COL.shoe,8);
  var neck=seg(svg,COL.skin,8);
  var head=NS('circle',{r:11,fill:COL.skin},svg);
  var hair=NS('path',{fill:COL.hair},svg);
  var eye1=NS('circle',{r:1.7,fill:'#2b2118'},svg),eye2=NS('circle',{r:1.7,fill:'#2b2118'},svg);
  var nA1=seg(svg,COL.skin,8),nA2=seg(svg,COL.skin,7),nHand=NS('circle',{r:4.5,fill:COL.skin},svg);
  return function(p){
    if(!p.h)p=toObj(p);
    // chân xa
    setSeg(fT,p.p,mid(p.p,p.k2,.9));
    setSeg(fS,p.k2,p.a2);setSeg(fShoe,p.a2,p.f2);
    setSeg(fA1,p.s,p.e2);setSeg(fA2,p.e2,p.w2);
    fHand.setAttribute('cx',p.w2[0]);fHand.setAttribute('cy',p.w2[1]);
    // thân
    setSeg(tor,p.p,p.s);
    // chân gần
    setSeg(nShort,p.p,mid(p.p,p.k,.9));
    setSeg(nS,p.k,p.a);setSeg(nShoe,p.a,p.f);
    // đầu
    setSeg(neck,p.s,p.h);
    head.setAttribute('cx',p.h[0]);head.setAttribute('cy',p.h[1]);
    var x=p.h[0],y=p.h[1],d;
    if(dir===0){d='M'+(x-11)+','+(y+1)+' A11 11 0 0 1 '+(x+11)+','+(y+1)+' Z';}

var PLAYERS=[],TICK=false;
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function createPlayer(svg,ex,onStep,speed){
  var set=createFigure(svg,ex);
  var fr=ex.frames.map(function(f){return {v:toVec(f.p),d:f.d,h:f.h||0};});
  var total=0,i;for(i=0;i<fr.length;i++)total+=fr[i].d+fr[i].h;
  var pl={svg:svg,t0:performance.now(),total:total,last:-1,speed:speed||1,
    draw:function(now){
      var t=((now-this.t0)*this.speed)%this.total,idx=0,n=fr.length,acc=0,from,to,u,v=[],j;
      for(idx=0;idx<n;idx++){
        var seglen=fr[idx].d+fr[idx].h;
        if(t<acc+seglen)break;acc+=seglen;
      }
      if(idx>=n)idx=n-1;
      var local=t-acc;
      from=fr[(idx+n-1)%n].v;to=fr[idx].v;
      u=fr[idx].d>0?Math.min(1,local/fr[idx].d):1;u=ease(u);
      for(j=0;j<to.length;j++)v.push(from[j]+(to[j]-from[j])*u);
      set(v);
      if(idx!==this.last){this.last=idx;if(onStep)onStep(idx);}
    }};
  PLAYERS.push(pl);pl.draw(pl.t0);startTick();
  return pl;
}
function startTick(){
  if(TICK)return;TICK=true;
  (function loop(now){
    var i,alive=[];
    for(i=0;i<PLAYERS.length;i++){
      if(PLAYERS[i].svg.isConnected){alive.push(PLAYERS[i]);if(!document.hidden)PLAYERS[i].draw(now);}
    }
    PLAYERS=alive;
    if(PLAYERS.length)requestAnimationFrame(loop);else TICK=false;
  })(performance.now());
}

  'lunge':['leg',5,3],'gap-bung':['abs',4,3],'jumping-jack':['full',8,1],'leo-nui':['abs full',8,1],
  'keo-xa-don':['sb arm',6,4],'keo-xa-uc':['sb arm',5,3],'treo-xa':['sb arm',3.5,1],
  'nang-chan':['abs',4,3],'da-chan':['abs',4,1],'cau-mong':['leg abs',3.5,3],'superman':['sb',3.5,3],

  'hit-dat-kim-cuong':['arm chest',5.5,3],'hit-dat-pike':['sb arm',5.5,3],'chong-day-ghe':['arm',5,3],
  'dam-tay':['arm full',6,1],'xoay-tay':['sb arm',3,1],'cham-vai':['sb abs',4.5,2],
  'squat-nhay':['leg full',8,3],'nhon-got':['leg',3,2],'ngoi-tuong':['leg',4,1],'da-sau':['leg',4,2],
  'buoc-ghe':['leg',6,3],'nang-goi':['full leg',8,1]};
EX.forEach(function(ex){var m=META[ex.id]||['full',4,3];ex.parts=m[0].split(' ');ex.met=m[1];ex.spr=m[2];});
// Ước tính kcal: MET × 3,5 × kg / 200 mỗi phút
function exSecs(ex,sets,n){return sets*(ex.mode==='time'?n:n*ex.spr);}
function exKcal(ex,sets,n,kg){return ex.met*3.5*(kg||60)/200*exSecs(ex,sets,n)/60;}

/* ===== 15 giáo án: 5 vùng cơ × 3 cấp ===== */

  abs:{b:['jumping-jack','gap-bung','nang-chan','cau-mong','leo-nui','plank'],
       i:['jumping-jack','gap-bung','da-chan','nang-chan','leo-nui','gap-v','plank'],

  leg:{b:['jumping-jack','squat','lunge','cau-mong','nhon-got','ngoi-tuong'],
       i:['nang-goi','squat','lunge','buoc-ghe','da-sau','squat-nhay','ngoi-tuong'],
       a:['nang-goi','squat-nhay','lunge','buoc-ghe','da-sau','burpee','ngoi-tuong']},
  sb:{b:['xoay-tay','superman','treo-xa','keo-xa-uc','hit-dat-goi'],
       i:['xoay-tay','superman','keo-xa-uc','hit-dat-pike','treo-xa','cham-vai'],
       a:['xoay-tay','keo-xa-don','hit-dat-pike','superman','keo-xa-uc','treo-xa']}};
var WARM={'jumping-jack':1,'xoay-tay':1,'nang-goi':1};
function roundN(ex,n){return ex.mode==='time'?Math.round(n/5)*5:Math.round(n);}
var PROGRAMS=[];
PARTS.forEach(function(pt){
  if(!PLAN_EX[pt.id])return;
  LEVELS.forEach(function(lv){
    PROGRAMS.push({id:pt.id+'-'+lv.id,part:pt.id,level:lv.id,name:pt.name+' · '+lv.name,
      items:PLAN_EX[pt.id][lv.id].map(function(id,i){
        var ex=exById(id),warm=(i===0&&WARM[id]);
        return {ex:id,sets:warm?1:lv.sets,n:roundN(ex,ex.reps*(warm?1:lv.mul))};})});
  });
});

/* ===== Thử thách 30 ngày toàn thân ===== */
var CH_TPL=[
  ['jumping-jack','squat','hit-dat-goi','gap-bung','cau-mong','plank'],
  ['nang-goi','lunge','hit-dat-nghieng','superman','da-chan','leo-nui'],
  ['jumping-jack','squat','hit-dat','nang-chan','cham-vai','burpee'],
  ['xoay-tay','buoc-ghe','chong-day-ghe','gap-v','da-sau','ngoi-tuong','plank']];
function chDay(d){   // d = 1..30; trả về null nếu là ngày nghỉ
  if(d%4===0)return null;
  var wk=Math.min(3,Math.floor((d-1)/7));          // tuần 0..3
  var n=Math.floor((d-1)/4)*3+((d-1)%4);            // thứ tự buổi tập
  var tpl=d===30?CH_TPL[3].concat(['burpee']):CH_TPL[n%4];
  var sets=[2,2,3,3][wk],mul=[1,1.2,1.3,1.5][wk];
  return tpl.map(function(id,i){var ex=exById(id),warm=(i===0&&WARM[id]);
    return {ex:id,sets:warm?1:sets,n:roundN(ex,ex.reps*(warm?1:mul))};});
}
function planMins(items){var s=0;items.forEach(function(it){var ex=exById(it.ex);s+=exSecs(ex,it.sets,it.n)+ex.rest*Math.max(0,it.sets-1)+ex.rest;});return Math.max(1,Math.round(s/60));}

function fmtNum(x,dec){var s=(dec?x.toFixed(dec):String(Math.round(x))).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return s.join(',');}

/* ----- Bài tập: mặc định + chỉnh sửa + bài tự thêm ----- */
var DEF={},EDIT_KEYS=['name','group','parts','mode','sets','reps','level','rest','desc','img','hidden'];
EX.forEach(function(ex){var d={};EDIT_KEYS.forEach(function(k){d[k]=ex[k];});d.parts=ex.parts.slice();d.steps=ex.steps;DEF[ex.id]=d;ex.builtin=true;});
function applyEx(ex,o){EDIT_KEYS.forEach(function(k){if(o[k]!==undefined)ex[k]=o[k];});
  if(!ex.builtin||ex.desc){ex.steps=[{t:ex.desc||'Thực hiện theo hình minh họa.',f:0}];}
  if(!ex.tips)ex.tips='Giữ đúng tư thế, thở đều. Mỏi quá thì giảm số lần.';
  if(!ex.met)ex.met=4;if(!ex.spr)ex.spr=ex.mode==='time'?1:3;if(!ex.rest)ex.rest=45;if(!ex.group)ex.group=groupNames(ex.parts);}
function groupNames(parts){return parts.map(function(p){var g=groupById(p);return g&&!g.deleted?g.name:'';}).filter(Boolean).join(' · ');}
function syncEx(){
  EX.forEach(function(ex){if(ex.builtin){var d=DEF[ex.id];EDIT_KEYS.forEach(function(k){ex[k]=k==='parts'?d.parts.slice():d[k];});ex.steps=d.steps;
    var o=DB.exo[ex.id];if(o)applyEx(ex,o);}});
  DB.cex.forEach(function(c){var ex=exById(c.id);if(!ex){ex={id:c.id,frames:null,dir:1};EX.push(ex);}
    applyEx(ex,c);ex.hidden=!!c.deleted;ex.group=groupNames(ex.parts);});
}
function exVisible(){return EX.filter(function(ex){return !ex.hidden;});}

/* ----- Ảnh / GIF lưu trong IndexedDB ----- */
var MEDIA={},IDB=null;
function idbOpen(cb){
  try{var r=indexedDB.open('fox-calisthenics',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('media');};
    r.onsuccess=function(){IDB=r.result;cb();};r.onerror=function(){cb();};}catch(e){cb();}
}
function mediaLoadAll(cb){
  if(!IDB)return cb();
  try{var tx=IDB.transaction('media','readonly'),st=tx.objectStore('media'),rq=st.openCursor();
    rq.onsuccess=function(){var c=rq.result;if(c){MEDIA[c.key]=c.value;c.continue();}else cb();};rq.onerror=function(){cb();};}catch(e){cb();}
}
function mediaPut(key,val){
  if(val)MEDIA[key]=val;else delete MEDIA[key];
  if(!IDB)return;
  try{var tx=IDB.transaction('media','readwrite');if(val)tx.objectStore('media').put(val,key);else tx.objectStore('media').delete(key);}catch(e){}
}
function readImage(file,cb){
  if(!file)return;
  var isGif=/gif$/i.test(file.type)||/\.gif$/i.test(file.name);
  if(isGif){if(file.size>4*1024*1024){toast('GIF lớn hơn 4 MB, hãy chọn file nhỏ hơn');return;}
    var fr=new FileReader();fr.onload=function(){cb(fr.result);};fr.readAsDataURL(file);return;}
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){var k=Math.min(1,720/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',.85));};
  img.onerror=function(){toast('Không đọc được ảnh này');};img.src=url;
}

var _createPlayer=createPlayer,_drawStatic=drawStatic;
function toImg(svg,ex){
  var src=MEDIA['ex:'+ex.id],el;
  if(src){el=document.createElement('img');el.src=src;el.alt=ex.name;}
  else{el=document.createElement('div');el.className='noimg';el.textContent='🏋️';}
  el.className=(svg.getAttribute('class')||'')+' '+(src?'mimg':'noimg');if(svg.id)el.id=svg.id;
  svg.parentNode.replaceChild(el,svg);return el;
}
createPlayer=function(svg,ex,onStep,speed){
  if(MEDIA['ex:'+ex.id]||!ex.frames){toImg(svg,ex);if(onStep)onStep(0);return null;}
  return _createPlayer(svg,ex,onStep,speed);
};
drawStatic=function(svg,ex,i){if(MEDIA['ex:'+ex.id]||!ex.frames){toImg(svg,ex);return;}_drawStatic(svg,ex,i);};

function plans(){return DB.plans.filter(function(p){return !p.deleted;});}

function planItems(p){return p.items.filter(function(i){return exById(i.ex);});}
function pdState(pid){var s=DB.pdone[pid];if(!s||s.date!==today()){s={date:today(),done:{}};DB.pdone[pid]=s;}return s;}
function pdCount(p){var s=DB.pdone[p.id];if(!s||s.date!==today())return 0;var c=0;p.items.forEach(function(it,i){if(s.done[i])c++;});return c;}
function setPlanDone(p,idx,val,fromRun){
  var s=pdState(p.id);if(val)s.done[idx]=1;else delete s.done[idx];
  var all=p.items.length&&p.items.every(function(it,i){return s.done[i];}),hid='pd-'+p.id+'-'+s.date,h=null;
  DB.history.forEach(function(x){if(x.id===hid)h=x;});
  if(all&&!fromRun){
    var items=planItems(p),kc=0;items.forEach(function(it){kc+=exKcal(exById(it.ex),it.sets,it.n,curKg()||60);});
    var rec={id:hid,date:s.date,ts:Date.now(),title:p.name,mins:planMins(items),kcal:Math.round(kc),src:'plan',key:p.id,updated:Date.now(),items:items.map(function(i){return {ex:i.ex,sets:i.sets,n:i.n};})};
    if(h){for(var k in rec)h[k]=rec[k];h.deleted=false;}else DB.history.push(rec);
  }else if(!all&&h&&!h.deleted){h.deleted=true;h.updated=Date.now();}
  saveDB();
}

function openPlanEditor(p){
  var draft={name:p?p.name:'',items:p?p.items.map(function(i){return {ex:i.ex,sets:i.sets,n:i.n};}):[]};
  openPage(p?'Sửa giáo án':'Tạo giáo án',function(b){
    var h='<div class="card"><label class="lb">Tên giáo án</label><input class="nt" id="pnName" value="'+esc(draft.name)+'" placeholder="Ví dụ: Sáng thứ 2"></div>';
    h+='<div class="sech"><div class="sec">Bài tập ('+draft.items.length+')</div><button class="lk" id="pnAdd">＋ Thêm bài</button></div><div class="card" id="pnList"></div>';
    if(p)h+='<button class="primary chi" id="pnDel">Xóa giáo án</button>';
    b.innerHTML=h;
    $('pnName').oninput=function(){draft.name=this.value;};
    $('pnAdd').onclick=function(){openPicker(draft.items.map(function(i){return i.ex;}),function(ids){
      var have={};draft.items.forEach(function(i){have[i.ex]=1;});
      draft.items=draft.items.filter(function(i){return ids.indexOf(i.ex)>=0;});
      ids.forEach(function(id){if(!have[id]){var ex=exById(id),c=cfgOf(ex);draft.items.push({ex:id,sets:c.sets,n:c.n});}});});};
    var L=$('pnList');
    if(!draft.items.length)L.innerHTML='<div class="empty">Chưa có bài. Bấm “＋ Thêm bài”.</div>';
    draft.items.forEach(function(it,i){
      var ex=exById(it.ex);if(!ex)return;var step=ex.mode==='time'?5:1;
      var r=document.createElement('div');r.className='prow';
      r.innerHTML='<div class="hrow"><div class="name">'+(i+1)+'. '+esc(ex.name)+'</div><div><button class="mv" data-a="up"'+(i?'':' disabled')+'>↑</button><button class="mv" data-a="dn"'+(i<draft.items.length-1?'':' disabled')+'>↓</button><button class="mv x" data-a="rm">✕</button></div></div>'+
        '<div class="hrow sm"><span class="sub">Hiệp</span><div class="st"><button data-a="s-">−</button><b>'+it.sets+'</b><button data-a="s+">+</button></div><span class="sub">'+(ex.mode==='time'?'Giây':'Lần')+'</span><div class="st"><button data-a="n-">−</button><b>'+it.n+'</b><button data-a="n+">+</button></div></div>';
      var bs=r.querySelectorAll('button');for(var k=0;k<bs.length;k++)bs[k].onclick=function(){var a=this.dataset.a;
        if(a==='up')moveIn(draft.items,i,-1);else if(a==='dn')moveIn(draft.items,i,1);else if(a==='rm')draft.items.splice(i,1);
        else if(a==='s-')it.sets=Math.max(1,it.sets-1);else if(a==='s+')it.sets=Math.min(10,it.sets+1);
        else if(a==='n-')it.n=Math.max(step,it.n-step);else if(a==='n+')it.n=Math.min(600,it.n+step);renderPage();};
      L.appendChild(r);
    });
    if($('pnDel'))$('pnDel').onclick=function(){ask('Xóa giáo án?','“'+esc(p.name)+'” sẽ bị xóa. Lịch sử tập không bị ảnh hưởng.','Xóa',true,function(){p.deleted=true;p.updated=Date.now();saveDB();popPage();});};
  },{foot:'Lưu lại & Thoát',onFoot:function(){
    var name=draft.name.trim();if(!name){toast('Nhập tên giáo án');return false;}
    var dup=plans().some(function(x){return x!==p&&noAcc(x.name)===noAcc(name);});if(dup){toast('Đã có giáo án cùng tên');return false;}
    if(p){p.name=name;p.items=draft.items;p.updated=Date.now();delete DB.pdone[p.id];}
    else DB.plans.push({id:'p'+uid(),name:name,items:draft.items,updated:Date.now()});
    saveDB();toast('Đã lưu giáo án');
  }});
}

/* ===== Fox-calisthenics 3: tab Bài tập (Quản lý bài tập) ===== */
var LIB_EDIT=false;
// Danh sách bài theo nhóm, có thứ tự riêng (DB.gorder)
function libGroups(){
  var vis=exVisible(),out=[];
  groups().forEach(function(g){
    var list=vis.filter(function(ex){return ex.parts.indexOf(g.id)>=0;}),ord=DB.gorder[g.id]||[];
    list.sort(function(a,b){var ia=ord.indexOf(a.id),ib=ord.indexOf(b.id);if(ia<0)ia=999+EX.indexOf(a);if(ib<0)ib=999+EX.indexOf(b);return ia-ib;});
    out.push({g:g,label:(g.ic?g.ic+' ':'')+g.name+' ('+list.length+')',list:list});
  });
  var none=vis.filter(function(ex){return !ex.parts.some(function(p){var g=groupById(p);return g&&!g.deleted;});});
  if(none.length)out.push({g:null,label:'Chưa phân nhóm ('+none.length+')',list:none});
  return out;
}

function weightChart(ws){
  ws=ws.slice(-30);if(ws.length<2)return '<div class="note">Ghi ít nhất 2 lần để xem biểu đồ.</div>';
  var W=340,H=180,L=40,R=12,T=26,B=28,min=Infinity,max=-Infinity;
  ws.forEach(function(w){min=Math.min(min,w.kg);max=Math.max(max,w.kg);});
  var pad2=Math.max(.5,(max-min)*.15);min-=pad2;max+=pad2;
  var X=function(i){return L+(W-L-R)*i/(ws.length-1);},Y=function(v){return T+(H-T-B)*(1-(v-min)/(max-min));};
  var s='<svg viewBox="0 0 '+W+' '+H+'" class="chart"><text x="'+L+'" y="14" class="ct">Cân nặng theo ngày ghi (kg)</text>';
  for(var g=0;g<=3;g++){var v=min+(max-min)*g/3,yy=Y(v);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" class="gl"/><text x="'+(L-6)+'" y="'+(yy+4)+'" class="ax" text-anchor="end">'+fmtNum(v,1)+'</text>';}
  var d='';ws.forEach(function(w,i){d+=(i?'L':'M')+X(i).toFixed(1)+','+Y(w.kg).toFixed(1);});
  s+='<path d="'+d+'" class="ln"/>';
  ws.forEach(function(w,i){s+='<circle cx="'+X(i)+'" cy="'+Y(w.kg)+'" r="3" class="dt"/>';});
  s+='<text x="'+L+'" y="'+(H-8)+'" class="ax">'+vnDate(ws[0].date).slice(0,5)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" class="ax" text-anchor="end">'+vnDate(ws[ws.length-1].date).slice(0,5)+'</text></svg>';
  return s;
}

  var bs=m.querySelectorAll('.li');for(var i=0;i<bs.length;i++)bs[i].onclick=function(){var t=T[this.dataset.p];TIPS_DRAFT=null;openPage(t[0],t[1],t[2]);};
}
function pgGoal(b){
  b.innerHTML='<div class="card"><div class="inp"><span>Số ngày tập mỗi tuần</span><div class="st"><button id="g1">−</button><b id="gv">'+LOC.goal+'</b><button id="g2">+</button></div></div><div class="note">Tuần tính từ Thứ 2 đến Chủ nhật. Tiến độ hiện ở đầu tab Huấn luyện.</div></div>';
  $('g1').onclick=function(){LOC.goal=Math.max(1,LOC.goal-1);saveLoc();$('gv').textContent=LOC.goal;};
  $('g2').onclick=function(){LOC.goal=Math.min(7,LOC.goal+1);saveLoc();$('gv').textContent=LOC.goal;};
}
function pgRem(b){
  var r=LOC.rem,h='<div class="card"><div class="inp"><span>Nhắc tập</span><label class="sw"><input type="checkbox" id="rOn"'+(r.on?' checked':'')+'><span></span></label></div>';
  h+='<div class="inp"><span>Giờ nhắc</span><input type="time" id="rT" value="'+r.time+'"></div><div class="days2">';
  [1,2,3,4,5,6,0].forEach(function(d){h+='<button class="dd'+(r.days.indexOf(d)>=0?' on':'')+'" data-d="'+d+'">'+WDN[d]+'</button>';});
  h+='</div><button class="primary" id="ics">📅 Thêm lịch nhắc vào Lịch iPhone</button>';
  h+='<div class="note">Ứng dụng web không tự gửi thông báo đáng tin cậy trên iPhone. Khi bật, app hiện dòng nhắc lúc bạn mở app sau giờ đã chọn. Muốn có chuông báo thật: bấm nút trên để thêm sự kiện lặp lại vào ứng dụng Lịch.</div></div>';
  b.innerHTML=h;
  $('rOn').onchange=function(){r.on=this.checked;saveLoc();};
  $('rT').onchange=function(){if(this.value){r.time=this.value;saveLoc();}};
  var ds=b.querySelectorAll('.dd');for(var i=0;i<ds.length;i++)ds[i].onclick=function(){var d=+this.dataset.d,k=r.days.indexOf(d);if(k>=0)r.days.splice(k,1);else r.days.push(d);saveLoc();this.className='dd'+(k>=0?'':' on');};
  $('ics').onclick=makeIcs;
}
var TIPS_DRAFT=null;
function pgTips(b){
  if(TIPS_DRAFT===null)TIPS_DRAFT=DB.tips.text||'';
  b.innerHTML='<div class="card"><label class="lb">Nội dung nhắc nhở (mỗi dòng là một ý)</label><textarea class="nt" id="tpT" rows="7" style="width:100%">'+esc(TIPS_DRAFT)+'</textarea><div class="note">Hiện ở cuối tab Huấn luyện. Xóa hết nội dung để ẩn.</div><button class="primary ghost" id="tpR">Khôi phục nội dung mặc định</button></div><div class="sec">Xem trước</div><div id="tpP"></div>';
  function prev(){var t=TIPS_DRAFT.split('\n').map(function(s){return s.trim();}).filter(Boolean);$('tpP').innerHTML=t.length?'<div class="tipbox">'+t.map(function(x){return '<div>• '+esc(x)+'</div>';}).join('')+'</div>':'<div class="empty">Đang ẩn</div>';}
  $('tpT').oninput=function(){TIPS_DRAFT=this.value;prev();};
  $('tpR').onclick=function(){TIPS_DRAFT=DEF_TIPS;$('tpT').value=DEF_TIPS;prev();};
  prev();
}
function saveTips(){DB.tips={text:TIPS_DRAFT===null?DB.tips.text:TIPS_DRAFT,updated:Date.now()};TIPS_DRAFT=null;saveDB();toast('Đã lưu nhắc nhở');}
function pgSnd(b){
  b.innerHTML='<div class="card"><div class="inp"><span>Âm báo (hết giờ, nghỉ)</span><label class="sw"><input type="checkbox" id="snd"'+(LOC.sound?' checked':'')+'><span></span></label></div><div class="note">Nếu không nghe tiếng, kiểm tra công tắc im lặng bên hông iPhone.</div></div>';
  $('snd').onchange=function(){LOC.sound=this.checked;saveLoc();if(LOC.sound)beep(660,120);};
}
function pgBk(b){
  var age=backupAge(),nImg=Object.keys(MEDIA).length;
  b.innerHTML=(LOC.backup?'<div class="'+(age>3?'warn':'ok')+'">Sao lưu gần nhất: '+vnDate(LOC.backup)+(age>3?' (đã quá 3 ngày)':'')+'</div>':'<div class="warn">⚠ Chưa sao lưu lần nào</div>')+
    '<div class="card"><button class="primary" id="exp" style="margin-top:0">Xuất file sao lưu</button><button class="primary ghost" id="imp">Nhập file sao lưu</button><input type="file" id="fi" accept=".json,application/json" style="display:none">'+
    '<div class="note">File sao lưu gồm lịch sử tập, giáo án, bài tập tự thêm và chỉnh sửa, nhóm cơ, ảnh/GIF ('+nImg+' hình), cân nặng, chiều cao, tiến độ thử thách và nhắc nhở. Dữ liệu chỉ nằm trong máy này: xóa biểu tượng ngoài màn hình chính hoặc xóa dữ liệu Safari sẽ mất hết. Nhập file sẽ gộp thêm, không ghi đè.</div></div>';
  $('exp').onclick=exportData;$('imp').onclick=function(){$('fi').click();};
  $('fi').onchange=function(ev){var f=ev.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){importData(rd.result);};rd.readAsText(f);};
}
function pgGuide(b){
  b.innerHTML='<div class="card guide"><b>Huấn luyện:</b> mục tiêu tuần, thử thách 30 ngày và mục <b>Giáo án</b>. Bấm chữ “Giáo án” để hiện nút <b>Tạo/Sửa</b>: tạo giáo án mới, đổi tên, thêm/bớt bài, chỉnh số hiệp – số lần, đổi thứ tự hoặc xóa.<br><br>'+
    '<b>Trong một giáo án:</b> bật nút <b>Hoàn thành</b> cạnh bài đã tập. Bật đủ tất cả thì buổi tập được ghi vào lịch sử. Sang ngày mới các nút tự tắt. Bấm “Bắt đầu tập” để app dẫn từng hiệp; tập xong các bài cũng tự được đánh dấu.<br><br>'+
    '<b>Bài tập:</b> số trong ngoặc là số bài. Bấm <b>Thêm/Sửa</b> để thêm bài tập (tên, nhiều nhóm cơ, số hiệp, số lần hoặc số giây, mức độ, ảnh/GIF, mô tả), thêm nhóm cơ, sửa bài và đổi thứ tự bằng ↑ ↓. Bài có sẵn chỉ ẩn, khôi phục lại được.<br><br>'+
    '<b>Báo cáo:</b> tổng buổi, kcal (ước tính), phút, lịch tập theo tháng, cân nặng, BMI và lịch sử.<br><br>'+
    '<b>Cài ra màn hình chính:</b> mở bằng Safari, bấm nút Chia sẻ, chọn “Thêm vào Màn hình chính”. Nhớ sao lưu trước khi xóa biểu tượng.</div>';
}
function pgInfo(b){b.innerHTML='<div class="card"><div class="name">Fox-calisthenics</div><div class="sub">Phiên bản '+APP_VER+'</div><div class="note">'+exVisible().length+' bài tập · '+plans().length+' giáo án · '+groups().length+' nhóm cơ</div></div>';}

/* ----- Sao lưu / nhập ----- */
function mergeList(a,b){var map={},add=0;a.forEach(function(s){map[s.id]=s;});(b||[]).forEach(function(s){if(!s||!s.id)return;var o=map[s.id];if(!o){a.push(s);add++;}else if((s.updated||0)>(o.updated||0)){for(var k in s)o[k]=s[k];}});return add;}
function importData(txt){
  try{
    var d=JSON.parse(txt);if(!d||!d.history)throw 0;
    var add=mergeList(DB.history,d.history);mergeList(DB.weights,d.weights);
    mergeList(DB.cex,d.cex);mergeList(DB.groups,d.groups);var ap=mergeList(DB.plans,d.plans);
    if(d.exo)for(var k in d.exo){var o=DB.exo[k];if(!o||(d.exo[k].updated||0)>(o.updated||0))DB.exo[k]=d.exo[k];}
    if((d.gorderU||0)>(DB.gorderU||0)){var ord=(d.groups||[]).map(function(g){return g.id;});DB.groups.sort(function(x,y){var i=ord.indexOf(x.id),j=ord.indexOf(y.id);return (i<0?999:i)-(j<0?999:j);});if(d.gorder)DB.gorder=d.gorder;DB.gorderU=d.gorderU;}
    if(d.ch&&d.ch.done){for(k in d.ch.done)if(!DB.ch.done[k])DB.ch.done[k]=d.ch.done[k];}
    if(d.prof&&(d.prof.updated||0)>(DB.prof.updated||0))DB.prof=d.prof;
    if(d.tips&&(d.tips.updated||0)>(DB.tips.updated||0))DB.tips=d.tips;
    if(d.media)for(k in d.media)if(!MEDIA[k])mediaPut(k,d.media[k]);
    saveDB();syncEx();closeAll();toast('Đã nhập: +'+add+' buổi tập, +'+ap+' giáo án');
  }catch(e){toast('File không đúng định dạng');}
}
function shareFile(name,text,type,done){
  var blob=new Blob([text],{type:type}),file;try{file=new File([blob],name,{type:type});}catch(e){file=null;}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).then(done||function(){}).catch(function(){});}
  else{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();if(done)done();}
}
function exportData(){
  var o={app:'Fox-calisthenics',version:APP_VER,exported:new Date().toISOString(),media:MEDIA};
  ['history','weights','ch','prof','cex','exo','groups','gorder','gorderU','plans','tips'].forEach(function(k){o[k]=DB[k];});
  shareFile('fox-calisthenics_'+ymd(new Date())+'.json',JSON.stringify(o),'application/json',function(){LOC.backup=ymd(new Date());saveLoc();if(PAGES.length)renderPage();render();});
}
function makeIcs(){
  var r=LOC.rem;if(!r.days.length){toast('Chọn ít nhất một ngày');return;}
  var BY=['SU','MO','TU','WE','TH','FR','SA'],t=r.time.split(':'),d=new Date();
  while(r.days.indexOf(d.getDay())<0)d.setDate(d.getDate()+1);
  var st=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(+t[0])+pad(+t[1])+'00';
  var end=new Date(d);end.setHours(+t[0],+t[1]+30,0,0);
  var en=end.getFullYear()+pad(end.getMonth()+1)+pad(end.getDate())+'T'+pad(end.getHours())+pad(end.getMinutes())+'00';
  var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Fox-calisthenics//VI','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:fox-calisthenics-'+uid(),
    'DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+st,'DTEND:'+en,
    'RRULE:FREQ=WEEKLY;BYDAY='+r.days.map(function(x){return BY[x];}).join(','),
    'SUMMARY:Tập Fox-calisthenics','DESCRIPTION:Mở app Fox-calisthenics để tập.','URL:'+location.href.split('#')[0],
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Đến giờ tập rồi!','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  shareFile('nhac-tap-fox-calisthenics.ics',ics,'text/calendar');
}

/* ----- Khởi động ----- */
document.addEventListener('DOMContentLoaded',function(){
  var bs=document.querySelectorAll('nav button'),i;
  for(i=0;i<bs.length;i++)bs[i].onclick=function(){if(PAGES.length){PAGES=[];$('page').className='';}go(this.dataset.t);};
  $('pback').onclick=popPage;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js');}catch(e){}
  idbOpen(function(){mediaLoadAll(function(){syncEx();render();});});
});

/* ===== Fox-calisthenics: chế độ tập (giữ như bản 1.x) ===== */
var AC=null,WL=null,RUN=null;
function beep(f,d){
  if(!LOC.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';
    g.gain.value=.18;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d/1000);
  }catch(e){}
}
function startRun(items,title,meta){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume();}catch(e){}
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){WL=l;}).catch(function(){});}catch(e){}
  RUN={items:items,title:title,meta:meta||{},qi:0,set:1,phase:'work',sub:'',done:[],t0:Date.now(),end:0,len:0,iv:null};
  beginWork();
}
function curItem(){var it=RUN.items[RUN.qi];return {it:it,ex:exById(it.ex)};}
function beginWork(){
  var c=curItem();RUN.phase='work';
  if(c.ex.mode==='time'){RUN.sub='ready';RUN.len=3000;RUN.end=Date.now()+3000;}
  else{RUN.sub='reps';RUN.end=0;}
  runUI();
}
function beginRest(sec){RUN.phase='rest';RUN.len=sec*1000;RUN.end=Date.now()+RUN.len;runUI();}
function completeSet(){
  var c=curItem(),d=null,i;
  for(i=0;i<RUN.done.length;i++)if(RUN.done[i].qi===RUN.qi)d=RUN.done[i];
  if(!d){d={qi:RUN.qi,ex:c.it.ex,sets:0,n:c.it.n};RUN.done.push(d);}
  d.sets++;beep(880,220);
  if(RUN.set<c.it.sets){RUN.set++;beginRest(c.ex.rest);}
  else if(RUN.qi<RUN.items.length-1){RUN.qi++;RUN.set=1;beginRest(c.ex.rest);}
  else finishRun();
}
function skipExercise(){
  if(RUN.qi<RUN.items.length-1){RUN.qi++;RUN.set=1;beginWork();}else finishRun();
}
function stopTimer(){if(RUN&&RUN.iv){clearInterval(RUN.iv);RUN.iv=null;}}
function closeRun(){
  stopTimer();var r=$('run');if(r)r.remove();
  try{if(WL){WL.release();WL=null;}}catch(e){}
  RUN=null;render();
}
function saveSession(){
  if(!RUN.done.length)return null;
  var kg=curKg()||60,kc=0;RUN.done.forEach(function(d){kc+=exKcal(exById(d.ex),d.sets,d.n,kg);});
  var s={id:uid(),date:ymd(new Date()),ts:Date.now(),title:RUN.title,mins:Math.max(1,Math.round((Date.now()-RUN.t0)/60000)),kcal:Math.round(kc),src:RUN.meta.src||'',key:RUN.meta.key||'',updated:Date.now(),
    items:RUN.done.map(function(d){return {ex:d.ex,sets:d.sets,n:d.n};})};
  DB.history.push(s);saveDB();return s;
}
function finishRun(){
  stopTimer();beep(660,150);setTimeout(function(){beep(990,300);},200);
  var s=saveSession(),r=$('run');
  if(s&&RUN.meta.src==='ch'){DB.ch.done[RUN.meta.key]=s.date;DB.ch.updated=Date.now();saveDB();CH_SEL=0;}
  if(RUN.meta.src==='plan'){var pl=planById(RUN.meta.key);if(pl)RUN.done.forEach(function(d){var it=RUN.items[d.qi];if(it&&d.sets>=it.sets)setPlanDone(pl,d.qi,true,true);});}
  var h='<div class="top"><span>Hoàn thành</span></div><div class="big" style="font-size:56px">🎉</div><div class="lab"><b>'+RUN.title+'</b></div>';
  if(s){
    var sets=0;s.items.forEach(function(i){sets+=i.sets;});
    h+='<div class="num"><div class="card"><b>'+s.mins+'</b>phút</div><div class="card"><b>'+s.kcal+'</b>kcal</div><div class="card"><b>'+sets+'</b>hiệp</div></div><div style="margin-top:12px">';
    s.items.forEach(function(i){var e=exById(i.ex);h+='<div class="sub" style="padding:2px 2px">'+e.name+' · '+i.sets+' × '+i.n+' '+unit(e)+'</div>';});
    h+='</div>';
  }else h+='<div class="empty">Chưa hoàn thành hiệp nào nên không lưu vào lịch sử.</div>';
  h+='<div class="grid"><button class="btn" id="fin">Xong</button></div>';
  r.innerHTML=h;$('fin').onclick=function(){closeRun();if(!PAGES.length)go('rep');};
}
function exitRun(){
  var msg=RUN.done.length?'Phần đã tập sẽ được lưu vào lịch sử.':'Chưa có hiệp nào hoàn thành nên sẽ không lưu.';
  ask('Thoát buổi tập?',msg,'Thoát',true,function(){saveSession();closeRun();});
}
function fmtT(ms){var s=Math.max(0,Math.ceil(ms/1000));return s;}
function runUI(){
  stopTimer();
  var r=$('run');if(!r){r=document.createElement('div');r.id='run';r.className='run';document.body.appendChild(r);}
  var c=curItem(),ex=c.ex,it=c.it,n=RUN.items.length,h='';
  h+='<div class="top"><span>Bài '+(RUN.qi+1)+'/'+n+' · Hiệp '+RUN.set+'/'+it.sets+'</span><span>'+RUN.title+'</span></div>';
  if(RUN.phase==='rest'){
    h+='<div class="lab rest" style="margin-top:14px"><b>NGHỈ</b></div><div class="big rest" id="big"></div><div class="bar"><i id="pb"></i></div>';
    h+='<div class="lab">Kế tiếp: <b>'+ex.name+'</b>, hiệp '+RUN.set+'</div><div class="hero"><svg id="rs"></svg></div>';
    h+='<div class="grid"><button class="btn or" id="skip">Bỏ qua nghỉ</button><button class="btn ghost" id="plus">+15 giây</button><button class="btn ghost" id="quit">Thoát</button></div>';
  }else{
    h+='<div class="name" style="text-align:center;margin-top:6px;font-size:22px">'+ex.name+'</div><div class="hero"><svg id="rs"></svg><div class="cap" id="rcap"></div></div>';
    if(ex.mode==='reps'){
      h+='<div class="big">'+it.n+'</div><div class="lab">lần · làm xong bấm “Xong hiệp”</div>';
      h+='<div class="grid"><button class="btn or" id="done">✓ Xong hiệp</button><button class="btn ghost" id="next">Bỏ qua bài này</button><button class="btn ghost" id="quit">Thoát</button></div>';
    }else{
      h+='<div class="big" id="big"></div><div class="bar"><i id="pb"></i></div><div class="lab" id="lb"></div>';
      h+='<div class="grid"><button class="btn or" id="done">✓ Xong sớm</button><button class="btn ghost" id="next">Bỏ qua bài này</button><button class="btn ghost" id="quit">Thoát</button></div>';
    }
  }
  r.innerHTML=h;
  createPlayer($('rs'),ex,function(idx){var cp=$('rcap');if(cp)cp.textContent='Bước '+(stepAt(ex,idx)+1)+': '+ex.steps[stepAt(ex,idx)].t;},1);
  $('quit').onclick=exitRun;
  if(RUN.phase==='rest'){
    $('skip').onclick=function(){beginWork();};
    $('plus').onclick=function(){RUN.end+=15000;RUN.len+=15000;};
  }else{
    $('done').onclick=function(){if(ex.mode==='time'&&RUN.sub==='ready')return;completeSet();};
    $('next').onclick=skipExercise;
  }
  if(RUN.end){
    var last=-1;
    RUN.iv=setInterval(function(){
      var left=RUN.end-Date.now(),s=fmtT(left),big=$('big');
      if(big){big.textContent=s;}
      var pb=$('pb');if(pb)pb.style.width=Math.max(0,Math.min(100,100*(1-left/RUN.len)))+'%';
      var lb=$('lb');if(lb)lb.textContent=RUN.sub==='ready'?'Chuẩn bị…':'giây còn lại · giữ đều nhịp thở';
      if(s!==last&&s<=3&&s>0)beep(660,120);
      last=s;
      if(left<=0){
        stopTimer();
        if(RUN.phase==='rest')beginWork();
        else if(RUN.sub==='ready'){beep(990,250);RUN.sub='go';RUN.len=it.n*1000;RUN.end=Date.now()+RUN.len;runUI();}
        else completeSet();
      }
    },200);
  }
}
